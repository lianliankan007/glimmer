<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随心裁 · 照片比例裁剪</title>
<style>
:root{color-scheme:light;--ink:#172d27;--muted:#586760;--accent:#245b48;--line:#dce3dd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 5% 0%,#dce8df,transparent 50%),radial-gradient(ellipse at 100% 90%,#eee6d8,transparent 50%),#f3f4f0;color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;min-height:100vh}main{max-width:1280px;margin:auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-size:22px;font-weight:750;letter-spacing:-1px}.brand span{background:var(--accent);color:white;border-radius:12px;padding:5px 10px;margin-right:10px}.badge{font-size:12px;color:var(--accent);background:#e5ede6;padding:6px 13px;border-radius:24px}h1{font-size:clamp(27px,4vw,40px);letter-spacing:-1.5px;margin:0 0 8px}p{color:var(--muted);margin:0}.intro{margin-bottom:26px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.shell{padding:6px;border:1px solid #fff;border-radius:26px;background:#ffffff70;box-shadow:0 12px 40px #253c3010}.panel{border:1px solid var(--line);background:#fafbf8;border-radius:20px;overflow:hidden;height:100%}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.small{font-size:12px;color:var(--muted)}#filename{max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{height:465px;background-color:#e9ece6;background-image:radial-gradient(#bac4b9 1px,transparent 1px);background-size:18px 18px;position:relative;display:flex;align-items:center;justify-content:center;padding:24px}.stage.over{outline:3px solid var(--accent);outline-offset:-4px}.empty{text-align:center}.empty .icon{font-size:44px;line-height:1;margin-bottom:20px}.empty strong{display:block;font-size:19px;margin-bottom:8px}.empty button{margin:22px 0 12px}canvas{display:block;max-width:100%}#editor{touch-action:none;cursor:move;border-radius:2px;box-shadow:0 5px 28px #0002}#editor[hidden],.empty[hidden]{display:none}.hint{padding:12px 18px;font-size:12px;color:var(--muted)}.controls{padding:22px}h2{font-size:16px;margin:0 0 18px}.step{color:#6b7f72;font-size:11px;letter-spacing:2px;margin-bottom:6px}.ratio{display:grid;grid-template-columns:1fr 20px 1fr;align-items:end;gap:8px}.ratio label{font-size:12px;color:var(--muted)}.ratio b{padding-bottom:10px;text-align:center}input[type=number],select{width:100%;min-width:0;padding:10px 12px;background:white;border:1px solid #c9d3cb;border-radius:10px;font:inherit;color:var(--ink)}input[type=number]{margin-top:5px;font-weight:650}button{border:1px solid #d5ded6;background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:9px 13px;border-radius:10px;cursor:pointer;transition:transform .2s cubic-bezier(.16,1.16,.3,1),background .2s}button:hover{background:#edf2ec;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}button.primary{background:var(--accent);border:1px solid #194534;color:white;box-shadow:inset 0 0 0 3px #ffffff14;padding:12px 22px}button.primary:hover{background:#174332}:focus-visible{outline:3px solid #8bad7b;outline-offset:3px}.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.presets button{padding:5px 10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.divider{height:1px;background:var(--line);margin:23px 0}input[type=range]{width:100%;accent-color:var(--accent);margin:12px 0}#preview{max-height:140px;max-width:100%;margin:auto;object-fit:contain;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/16px 16px}.preview-wrap{min-height:110px;display:flex;align-items:center;justify-content:center;background:#edf0e9;border-radius:12px;padding:12px;margin-bottom:12px;overflow:hidden}#download{width:100%;margin-top:16px}#status{min-height:38px;padding-top:12px;font-size:12px;overflow-wrap:anywhere}#status.error{color:#ac3426}footer{display:flex;justify-content:space-between;gap:14px;margin-top:20px;font-size:12px;color:var(--muted)}@media(max-width:850px){main{padding:20px}.layout{grid-template-columns:1fr}.stage{height:400px}.controls{padding:20px}.intro p{font-size:13px}}@media(max-width:450px){main{padding:14px}.badge{font-size:10px}.stage{height:300px;padding:12px}footer{display:block}.bar{padding:12px}.brand{font-size:19px}}@media(prefers-reduced-motion:reduce){button{transition:none}}@media print{header,.controls,footer,.hint,.intro,.bar{display:none}.layout{display:block}.stage{background:white}}
</style>
</head>
<body>
<main>
<header><div class="brand"><span>⌗</span>随心裁</div><div class="badge">本地处理 · 无需上传服务器</div></header>
<section class="intro"><h1>好照片，刚刚好的比例。</h1><p>输入你想要的宽高比，移动取景框，让每一张照片恰到好处。</p></section>
<div class="layout">
<section class="shell"><div class="panel">
<div class="bar"><span id="filename" class="small">尚未选择照片</span><button id="replace">选择照片</button></div>
<div class="stage" id="stage">
<div class="empty" id="empty"><div class="icon">▧</div><strong>把照片拖到这里</strong><p>也可以从设备中选择一张照片</p><button id="choose" class="primary">＋ 选择照片</button><p class="small">支持 JPG、PNG、WebP 等浏览器可读取的图片</p></div>
<canvas id="editor" hidden tabindex="0" role="img" aria-label="照片裁剪区域。拖动取景框或使用方向键调整位置，Shift 加方向键快速移动。"></canvas>
</div><div class="hint">拖动取景框调整位置 · 使用滑块改变范围 · 聚焦图片后可用方向键微调</div>
</div></section>
<aside class="shell"><div class="panel controls">
<div class="step">01 / 设定比例</div><h2>想要多宽，就裁多宽</h2>
<div class="ratio"><label>宽<input id="rw" type="number" min="0" step="any" value="4" inputmode="decimal"></label><b>:</b><label>高<input id="rh" type="number" min="0" step="any" value="3" inputmode="decimal"></label></div>
<div class="presets"><button data-ratio="1,1">1:1</button><button data-ratio="4,3">4:3</button><button data-ratio="3,2">3:2</button><button data-ratio="16,9">16:9</button><button data-ratio="9,16">9:16</button></div>
<div class="row"><button id="original" disabled>原图比例</button><button id="swap">⇄ 交换宽高</button></div>
<div class="divider"></div><div class="step">02 / 调整取景</div>
<div class="row"><label for="size">裁剪范围</label><output id="percent">100%</output></div><input id="size" type="range" min="5" max="100" value="100" disabled>
<div class="row small"><span>缩小范围，聚焦细节</span><button id="reset" disabled>居中重置</button></div>
<div class="divider"></div><div class="step">03 / 保存照片</div>
<div class="preview-wrap"><canvas id="preview" width="240" height="110" aria-label="裁剪效果预览"></canvas></div>
<p id="dimensions" class="small">上传照片后显示输出尺寸</p>
<div class="row"><label for="format">图片格式</label><select id="format" style="width:130px"><option value="image/png">PNG 无损</option><option value="image/jpeg">JPG 高质量</option><option value="image/webp">WebP</option></select></div>
<button class="primary" id="download" disabled>下载裁剪照片 ↓</button><p id="status" role="status" aria-live="polite">支持小数比例，例如 2.35 : 1。</p>
</div></aside></div>
<footer><span>照片只在当前浏览器处理，断网也能使用。</span><span>保留所选区域的原始像素 · 不拉伸画面</span></footer>
<input id="file" type="file" accept="image/*" hidden>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const editor=$('editor'),ctx=editor.getContext('2d'),preview=$('preview'),pc=preview.getContext('2d');
let photo=null,fileName='',crop=null,displayScale=1,drag=null,loadVersion=0,exporting=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function message(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
// 裁剪坐标始终使用原图像素，窗口缩放只影响显示，不影响导出清晰度。
function ratio(){const w=Number($('rw').value),h=Number($('rh').value);return w>0&&h>0&&Number.isFinite(w/h)&&w/h>0?w/h:null;}
function updateCrop(center=false){
 const r=ratio();
 if(!r){$('download').disabled=true;message('请输入大于 0 的有效宽、高数值。',true);return;}
 if(!photo){message('支持小数比例，例如 2.35 : 1。');return;}
 const maxW=Math.min(photo.naturalWidth,photo.naturalHeight*r),w=maxW*Number($('size').value)/100,h=w/r;
 if(w<1||h<1){$('download').disabled=true;message('当前比例或范围会使一条边不足 1 像素，请调整比例或增大范围。',true);return;}
 const cx=!center&&crop?crop.x+crop.w/2:photo.naturalWidth/2,cy=!center&&crop?crop.y+crop.h/2:photo.naturalHeight/2;
 crop={x:clamp(cx-w/2,0,photo.naturalWidth-w),y:clamp(cy-h/2,0,photo.naturalHeight-h),w,h};
 $('download').disabled=exporting;message('拖动取景框调整构图，确认后即可下载。');draw();
}
function fit(){if(!photo)return;const s=getComputedStyle($('stage')),aw=$('stage').clientWidth-parseFloat(s.paddingLeft)-parseFloat(s.paddingRight),ah=$('stage').clientHeight-parseFloat(s.paddingTop)-parseFloat(s.paddingBottom);displayScale=Math.min(aw/photo.naturalWidth,ah/photo.naturalHeight,1);editor.width=Math.max(1,Math.round(photo.naturalWidth*displayScale));editor.height=Math.max(1,Math.round(photo.naturalHeight*displayScale));draw();}
function draw(){
 if(!photo||!crop)return;
 const sx=editor.width/photo.naturalWidth,sy=editor.height/photo.naturalHeight,x=crop.x*sx,y=crop.y*sy,w=crop.w*sx,h=crop.h*sy;
 ctx.clearRect(0,0,editor.width,editor.height);ctx.drawImage(photo,0,0,editor.width,editor.height);
 ctx.fillStyle='#0b1c26a8';ctx.beginPath();ctx.rect(0,0,editor.width,editor.height);ctx.rect(x,y,w,h);ctx.fill('evenodd');
 ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);ctx.strokeStyle='#ffffff65';ctx.lineWidth=1;
 for(let i=1;i<=2;i++){ctx.beginPath();ctx.moveTo(x+w*i/3,y);ctx.lineTo(x+w*i/3,y+h);ctx.moveTo(x,y+h*i/3);ctx.lineTo(x+w,y+h*i/3);ctx.stroke();}
 ctx.strokeStyle='#fff';ctx.lineWidth=3;const l=Math.min(17,w/4,h/4);for(const [a,b,dx,dy]of[[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]]){ctx.beginPath();ctx.moveTo(a+dx*l,b);ctx.lineTo(a,b);ctx.lineTo(a,b+dy*l);ctx.stroke();}
 const ps=Math.min(240/crop.w,140/crop.h);preview.width=Math.max(1,Math.round(crop.w*ps));preview.height=Math.max(1,Math.round(crop.h*ps));pc.drawImage(photo,crop.x,crop.y,crop.w,crop.h,0,0,preview.width,preview.height);
 $('dimensions').textContent=`输出 ${Math.round(crop.w)} × ${Math.round(crop.h)} 像素（按整像素取整）`;
}
// 异步读取只接受最后一次选择，避免连续换图导致旧图覆盖新图。
async function load(file){
 if(!file)return;const version=++loadVersion,url=URL.createObjectURL(file),img=new Image();message('正在读取照片…');
 try{img.src=url;await img.decode();if(version!==loadVersion)return;if(!img.naturalWidth||!img.naturalHeight)throw Error();photo=img;fileName=file.name;crop=null;$('filename').textContent=`${file.name} · ${img.naturalWidth} × ${img.naturalHeight}`;$('empty').hidden=true;editor.hidden=false;for(const id of ['size','reset','original'])$(id).disabled=false;$('size').value=100;$('percent').textContent='100%';updateCrop(true);fit();}
 catch(e){if(version===loadVersion)message('无法读取这张图片，请尝试 JPG、PNG 或 WebP 文件。',true);}
 finally{URL.revokeObjectURL(url);}
}
for(const id of ['choose','replace'])$(id).onclick=()=>$('file').click();
$('file').onchange=e=>{load(e.target.files[0]);e.target.value='';};
for(const event of ['dragenter','dragover'])$('stage').addEventListener(event,e=>{e.preventDefault();$('stage').classList.add('over');});
$('stage').ondragleave=()=>$('stage').classList.remove('over');$('stage').ondrop=e=>{e.preventDefault();$('stage').classList.remove('over');load(e.dataTransfer.files[0]);};
for(const id of ['rw','rh'])$(id).oninput=()=>updateCrop();
document.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.ratio.split(',');$('rw').value=w;$('rh').value=h;updateCrop();});
$('swap').onclick=()=>{const w=$('rw').value;$('rw').value=$('rh').value;$('rh').value=w;updateCrop();};
$('original').onclick=()=>{if(!photo)return;$('rw').value=photo.naturalWidth;$('rh').value=photo.naturalHeight;updateCrop(true);};
$('size').oninput=()=>{$('percent').textContent=$('size').value+'%';updateCrop();};
$('reset').onclick=()=>{$('size').value=100;$('percent').textContent='100%';updateCrop(true);};
function point(e){const b=editor.getBoundingClientRect();return{x:(e.clientX-b.left)*photo.naturalWidth/b.width,y:(e.clientY-b.top)*photo.naturalHeight/b.height};}
editor.onpointerdown=e=>{if(!crop||e.button!==0)return;const p=point(e);if(p.x<crop.x||p.x>crop.x+crop.w||p.y<crop.y||p.y>crop.y+crop.h)return;drag={id:e.pointerId,x:p.x,y:p.y,cx:crop.x,cy:crop.y};editor.setPointerCapture(e.pointerId);editor.focus();e.preventDefault();};
editor.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e);crop.x=clamp(drag.cx+p.x-drag.x,0,photo.naturalWidth-crop.w);crop.y=clamp(drag.cy+p.y-drag.y,0,photo.naturalHeight-crop.h);draw();};
for(const ev of ['pointerup','pointercancel','lostpointercapture'])editor.addEventListener(ev,()=>{drag=null;});
editor.onkeydown=e=>{if(!crop)return;const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]},m=moves[e.key];if(!m)return;e.preventDefault();const step=e.shiftKey?10:1;crop.x=clamp(crop.x+m[0]*step,0,photo.naturalWidth-crop.w);crop.y=clamp(crop.y+m[1]*step,0,photo.naturalHeight-crop.h);draw();};
// 导出直接从原图取样；JPG 不支持透明度，因此使用白色背景。
$('download').onclick=async()=>{
 if(!photo||!crop||!ratio()||exporting)return;exporting=true;$('download').disabled=true;
 const output=document.createElement('canvas'),mime=$('format').value,base=fileName.replace(/\.[^.]+$/,'')||'照片';
 try{output.width=Math.round(crop.w);output.height=Math.round(crop.h);const c=output.getContext('2d');if(mime==='image/jpeg'){c.fillStyle='#fff';c.fillRect(0,0,output.width,output.height);}c.drawImage(photo,crop.x,crop.y,crop.w,crop.h,0,0,output.width,output.height);const blob=await new Promise(resolve=>output.toBlob(resolve,mime,.95));if(!blob)throw Error();const url=URL.createObjectURL(blob),a=document.createElement('a'),ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[blob.type]||'png';a.href=url;a.download=`${base}_裁剪_${output.width}x${output.height}.${ext}`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);message('照片已生成，下载已发起。');}
 catch(e){message('导出失败，图片可能过大。请缩小裁剪范围后重试。',true);}
 finally{output.width=0;output.height=0;exporting=false;$('download').disabled=!ratio();}
};
new ResizeObserver(fit).observe($('stage'));
</script>
</body>
</html>
