<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="description" content="微光 Glimmer，一个轻巧的本地工具箱。JSON 格式化、分表定位、照片裁剪，在一个页面里轻松完成。">
  <title>微光 · Glimmer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #252b3e;
      --muted: #818799;
      --line: #e6e8f0;
      --accent: #6558da;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      color: var(--ink);
      background: #f8f9fc;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #a79dea; outline-offset: 4px; }
    .site-header {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      border-bottom: 1px solid var(--line);
      background: #ffffffd9;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid #e5dff7;
      border-radius: 12px;
      color: var(--accent);
      background: linear-gradient(145deg, #f4efff, #fff6e6);
    }
    .brand-name { font-size: 21px; font-weight: 750; letter-spacing: 3px; }
    .brand-en { margin-left: 9px; color: #9694a7; font-size: 13px; letter-spacing: 1px; font-weight: 400; }
    .header-note { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #65a58e; box-shadow: 0 0 0 4px #65a58e12; }
    main { padding: 0 28px; max-width: 1920px; margin: auto; }
    .intro { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 8px; }
    h1 { margin: 0 0 7px; font-size: 23px; font-weight: 650; letter-spacing: 1px; }
    .intro p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .tool-count { color: #999cad; font-size: 12px; white-space: nowrap; }
    .tool-count b { color: #646a81; font: 500 20px/1.4 Consolas, monospace; margin-right: 6px; }
    .workspace { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 8px 36px #33334b06; }
    .workspace-bar { display: flex; justify-content: space-between; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line); }
    .tabs { display: flex; gap: 28px; overflow-x: auto; }
    .tab {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 9px;
      min-height: 60px;
      padding: 0 3px;
      border: 0;
      color: #838799;
      background: transparent;
      font-size: 13px;
      transition: color .18s;
    }
    .tab:hover { color: var(--accent); }
    .tab[aria-selected="true"] { color: var(--accent); font-weight: 650; }
    .tab[aria-selected="true"]::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
    svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .brand-mark svg { width: 25px; height: 25px; }
    .open-link { display: flex; align-items: center; gap: 7px; flex-shrink: 0; align-self: center; color: #818799; font-size: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; }
    .open-link:hover { color: var(--accent); background: #f8f7ff; }
    .open-link svg { width: 14px; height: 14px; }
    .tool-panel { height: calc(100dvh - 284px); min-height: 480px; background: #f6f7fb; }
    iframe { width: 100%; height: 100%; display: block; border: 0; }
    footer { display: flex; justify-content: space-between; gap: 16px; padding: 14px 8px; font-size: 11px; color: #999eae; }
    .footer-brand { letter-spacing: 1px; }
    noscript p { padding: 20px; line-height: 2; }
    noscript a { color: var(--accent); text-decoration: underline; margin-right: 15px; }
    @media (max-width: 640px) {
      .site-header { height: 66px; padding: 0 18px; }
      .brand-name { font-size: 19px; }
      .brand-en { font-size: 11px; margin-left: 5px; }
      .header-note { font-size: 11px; }
      .header-note .extra { display: none; }
      main { padding: 0 10px; }
      .intro { padding: 20px 6px; }
      h1 { font-size: 20px; }
      .intro p { font-size: 12px; }
      .tool-count { display: none; }
      .workspace { border-radius: 12px; }
      .workspace-bar { padding: 0 12px; gap: 10px; }
      .tabs { gap: 19px; }
      .tab { min-height: 55px; font-size: 12px; gap: 6px; }
      .tab svg { width: 16px; height: 16px; }
      .open-link { padding: 7px; }
      .open-link span { display: none; }
      .tool-panel { height: calc(100dvh - 256px); }
      footer { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { .tab { transition: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="微光 Glimmer 主页">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c0 6-3 9-9 9 6 0 9 3 9 9 0-6 3-9 9-9-6 0-9-3-9-9Z"/><path d="M20 2v4m-2-2h4"/></svg></span>
      <span class="brand-name">微光<span class="brand-en">Glimmer</span></span>
    </a>
    <div class="header-note"><span class="status-dot" aria-hidden="true"></span>本地运行<span class="extra"> · 轻巧随行</span></div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div><h1 id="page-title">小工具，点亮日常。</h1><p>把琐碎交给工具，把专注留给自己。</p></div>
      <span class="tool-count"><b>03</b> 个顺手的工具</span>
    </section>
    <div class="workspace">
      <div class="workspace-bar">
        <nav class="tabs" role="tablist" aria-label="工具切换">
          <button class="tab" id="tab-json" type="button" role="tab" aria-selected="true" aria-controls="panel-json" data-tool="json">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H6v6l-2 2 2 2v6h2m8-16h2v6l2 2-2 2v6h-2"/><path d="M11 9h2m-2 6h2"/></svg>JSON 工具
          </button>
          <button class="tab" id="tab-sharding" type="button" role="tab" aria-selected="false" aria-controls="panel-sharding" tabindex="-1" data-tool="sharding">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7m-3.5-3.5v7"/></svg>分表定位
          </button>
          <button class="tab" id="tab-photo" type="button" role="tab" aria-selected="false" aria-controls="panel-photo" tabindex="-1" data-tool="photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v14h14M3 7h14v14M10 7h7v7"/></svg>照片裁剪
          </button>
        </nav>
        <a class="open-link" id="open-tool" href="./json-lens.html?v=2" target="_blank" rel="noopener" aria-label="在新窗口打开 JSON 工具" title="在新窗口打开当前工具"><span>独立打开</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
      </div>
      <section class="tool-panel" id="panel-json" role="tabpanel" aria-labelledby="tab-json">
        <iframe title="JSON 格式化与结构查看器" data-src="./json-lens.html?v=2"></iframe>
      </section>
      <section class="tool-panel" id="panel-sharding" role="tabpanel" aria-labelledby="tab-sharding" hidden>
        <iframe title="分表定位器" data-src="./sharding-table-finder.html?v=2"></iframe>
      </section>
      <section class="tool-panel" id="panel-photo" role="tabpanel" aria-labelledby="tab-photo" hidden>
        <iframe title="照片比例裁剪" data-src="./photo-crop.html?v=2"></iframe>
      </section>
      <noscript><p>启用 JavaScript 即可使用标签页，也可以直接打开：<a href="./json-lens.html?v=2">JSON 工具</a><a href="./sharding-table-finder.html?v=2">分表定位</a><a href="./photo-crop.html?v=2">照片裁剪</a></p></noscript>
    </div>
    <footer><span>每一点微光，都让事情简单一点。</span><span class="footer-brand">微光 · Glimmer</span></footer>
  </main>
  <script>
    'use strict';
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const openLink = document.getElementById('open-tool');

    /**
     * 切换工具并同步无障碍状态；已打开的页面保留在内存中，避免切换丢失输入或照片。
     * @param {string} tool 工具标识；未知值回退到 JSON 工具。
     */
    function activateTool(tool) {
      const activeTab = tabs.find(tab => tab.dataset.tool === tool) || tabs[0];
      for (const tab of tabs) {
        const selected = tab === activeTab;
        const panel = document.getElementById(tab.getAttribute('aria-controls'));
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
        panel.hidden = !selected;
        if (selected) {
          const frame = panel.querySelector('iframe');
          // 首次选中才加载，且仅使用页面内预设路径，URL 片段不能指定外部地址。
          if (!frame.hasAttribute('src')) frame.src = frame.dataset.src;
          openLink.href = frame.dataset.src;
          openLink.setAttribute('aria-label', `在新窗口打开${tab.textContent.trim()}`);
        }
      }
    }

    /** 更新地址片段，让工具标签支持直接访问以及浏览器前进、后退。 */
    function selectTool(tab) {
      activateTool(tab.dataset.tool);
      if (location.hash !== `#${tab.dataset.tool}`) location.hash = tab.dataset.tool;
    }

    for (const tab of tabs) {
      tab.addEventListener('click', () => selectTool(tab));
      tab.addEventListener('keydown', event => {
        const index = tabs.indexOf(tab);
        let nextIndex;
        // 遵循横向标签页键盘约定，Tab 键只停留在当前选中的工具。
        if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
        else if (event.key === 'ArrowLeft') nextIndex = (index + tabs.length - 1) % tabs.length;
        else if (event.key === 'Home') nextIndex = 0;
        else if (event.key === 'End') nextIndex = tabs.length - 1;
        else return;
        event.preventDefault();
        tabs[nextIndex].focus();
        selectTool(tabs[nextIndex]);
      });
    }
    window.addEventListener('hashchange', () => activateTool(location.hash.slice(1)));
    activateTool(location.hash.slice(1));
  </script>
</body>
</html>
