<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="description" content="微光 Glimmer，一个轻巧的本地工具箱。JSON 格式化、分表定位、照片裁剪、SQL 辅助，在一个页面里轻松完成。">
  <title>微光 · Glimmer</title>
  <style>
    :root { color-scheme: light; --ink: #252b3e; --muted: #818799; --line: #e6e8f0; --accent: #6558da; --sidebar-width: 220px; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); height: 100vh; height: 100dvh; margin: 0; overflow: hidden; color: var(--ink); background: #f8f9fc; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #a79dea; outline-offset: -3px; }
    svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .sidebar { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 24px 12px 16px; border-right: 1px solid var(--line); background: #f0f1f8; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; min-height: 42px; }
    .brand-mark { display: grid; place-items: center; flex-shrink: 0; width: 38px; height: 38px; border: 1px solid #e5dff7; border-radius: 12px; color: var(--accent); background: linear-gradient(145deg, #f4efff, #fff6e6); }
    .brand-mark svg { width: 25px; height: 25px; }
    .brand-name { font-size: 20px; font-weight: 750; letter-spacing: 3px; white-space: nowrap; }
    .brand-en { display: block; margin-top: 3px; color: #9694a7; font-size: 11px; letter-spacing: 1px; font-weight: 400; }
    .sidebar-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 30px 4px 12px 10px; }
    .sidebar-heading span { color: #9297aa; font-size: 11px; letter-spacing: 1px; }
    .sidebar-toggle { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; color: var(--muted); background: transparent; }
    .sidebar-toggle:hover { color: var(--accent); background: #e6e5f4; }
    .tabs { display: flex; flex-direction: column; gap: 7px; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 3px; }
    .tab { position: relative; display: flex; align-items: center; flex-shrink: 0; gap: 12px; width: 100%; min-height: 46px; padding: 0 14px; border: 1px solid transparent; border-radius: 10px; color: #767d94; background: transparent; text-align: left; font-size: 13px; transition: color .18s, background .18s; }
    .tab:hover { color: var(--accent); background: #e8e8f4; }
    .tab[aria-selected="true"] { color: var(--accent); font-weight: 650; border-color: #e1dff3; background: white; box-shadow: 0 3px 10px #33334b07; }
    .tab[aria-selected="true"]::before { content: ""; position: absolute; top: 13px; bottom: 13px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
    .tab-label { white-space: nowrap; }
    .sidebar-footer { display: flex; align-items: center; gap: 9px; margin-top: auto; padding: 24px 12px 2px; color: #9297aa; font-size: 11px; white-space: nowrap; }
    .status-dot { width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; background: #65a58e; box-shadow: 0 0 0 4px #65a58e12; }
    main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; padding: 0 20px; }
    .intro { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 100px; padding: 18px 4px; }
    h1 { margin: 0 0 7px; font-size: 21px; font-weight: 650; letter-spacing: 1px; }
    .intro p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .open-link { display: flex; align-items: center; gap: 7px; flex-shrink: 0; color: var(--muted); font-size: 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .open-link:hover { color: var(--accent); background: #f8f7ff; }
    .open-link svg { width: 14px; height: 14px; }
    .workspace { min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 8px 36px #33334b06; }
    .tool-panel { height: 100%; background: #f6f7fb; }
    iframe { width: 100%; height: 100%; display: block; border: 0; }
    footer { display: flex; justify-content: space-between; gap: 16px; padding: 13px 4px; color: #999eae; font-size: 11px; }
    .footer-brand { letter-spacing: 1px; }
    noscript p { padding: 20px; line-height: 2; }
    noscript a { color: var(--accent); text-decoration: underline; margin-right: 15px; }
    /* 收起标签文字后保留等宽图标轨道，右侧工作区自动获得空出的宽度。 */
    body.sidebar-collapsed { --sidebar-width: 68px; }
    .sidebar-collapsed .sidebar { padding-left: 8px; padding-right: 8px; }
    .sidebar-collapsed .brand { justify-content: center; padding: 0; }
    .sidebar-collapsed .brand-name, .sidebar-collapsed .sidebar-heading span, .sidebar-collapsed .tab-label, .sidebar-collapsed .sidebar-footer span:last-child { display: none; }
    .sidebar-collapsed .sidebar-heading { justify-content: center; margin: 30px 0 12px; }
    .sidebar-collapsed .tab { justify-content: center; padding: 0; }
    .sidebar-collapsed .sidebar-footer { justify-content: center; padding-left: 0; padding-right: 0; }
    @media (max-width: 700px) {
      body, body.sidebar-collapsed { --sidebar-width: 56px; }
      .sidebar, .sidebar-collapsed .sidebar { padding: 18px 5px 12px; }
      .brand { justify-content: center; padding: 0; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-name, .sidebar-heading, .sidebar-collapsed .sidebar-heading, .tab-label, .sidebar-footer span:last-child { display: none; }
      .tabs { margin-top: 24px; gap: 9px; }
      .tab { justify-content: center; padding: 0; min-height: 42px; }
      .sidebar-footer { justify-content: center; padding-left: 0; padding-right: 0; }
      main { padding: 0 8px; }
      .intro { min-height: 84px; gap: 8px; padding: 14px 2px; }
      h1 { font-size: 16px; letter-spacing: 0; }
      .intro p { font-size: 10px; }
      .open-link { padding: 8px; }
      .open-link span { display: none; }
      .workspace { border-radius: 12px; }
      footer { padding: 10px 2px; font-size: 10px; }
      footer > span:first-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .tab { transition: none; } }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="工具导航">
    <a class="brand" href="./index.html" aria-label="微光 Glimmer 主页">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c0 6-3 9-9 9 6 0 9 3 9 9 0-6 3-9 9-9-6 0-9-3-9-9Z"/><path d="M20 2v4m-2-2h4"/></svg></span>
      <span class="brand-name">微光<span class="brand-en">Glimmer</span></span>
    </a>
    <div class="sidebar-heading"><span>工具标签 · 04</span><button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="收起标签栏" title="收起标签栏" aria-expanded="true" aria-controls="tool-tabs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m7-12-3 4 3 4"/></svg></button></div>
        <nav class="tabs" role="tablist" aria-label="工具切换" aria-orientation="vertical" id="tool-tabs">
          <button class="tab" id="tab-json" type="button" role="tab" aria-selected="true" aria-controls="panel-json" data-tool="json" aria-label="JSON 工具" title="JSON 工具">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H6v6l-2 2 2 2v6h2m8-16h2v6l2 2-2 2v6h-2"/><path d="M11 9h2m-2 6h2"/></svg><span class="tab-label">JSON 工具</span>
          </button>
          <button class="tab" id="tab-sharding" type="button" role="tab" aria-selected="false" aria-controls="panel-sharding" tabindex="-1" data-tool="sharding" aria-label="分表定位" title="分表定位">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7m-3.5-3.5v7"/></svg><span class="tab-label">分表定位</span>
          </button>
          <button class="tab" id="tab-photo" type="button" role="tab" aria-selected="false" aria-controls="panel-photo" tabindex="-1" data-tool="photo" aria-label="照片裁剪" title="照片裁剪">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v14h14M3 7h14v14M10 7h7v7"/></svg><span class="tab-label">照片裁剪</span>
          </button>
          <button class="tab" id="tab-sql" type="button" role="tab" aria-selected="false" aria-controls="panel-sql" tabindex="-1" data-tool="sql" aria-label="SQL 辅助" title="SQL 辅助">
            <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><span class="tab-label">SQL 辅助</span>
          </button>
        </nav>
    <div class="sidebar-footer"><span class="status-dot" aria-hidden="true"></span><span>本地运行 · 轻巧随行</span></div>
  </aside>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div><h1 id="page-title">小工具，点亮日常。</h1><p>把琐碎交给工具，把专注留给自己。</p></div>
        <a class="open-link" id="open-tool" href="./json-lens.html?v=2" target="_blank" rel="noopener" aria-label="在新窗口打开 JSON 工具" title="在新窗口打开当前工具"><span>独立打开</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
    </section>
    <div class="workspace">
      <section class="tool-panel" id="panel-json" role="tabpanel" aria-labelledby="tab-json">
        <iframe title="JSON 格式化与结构查看器" data-src="./json-lens.html?v=2"></iframe>
      </section>
      <section class="tool-panel" id="panel-sharding" role="tabpanel" aria-labelledby="tab-sharding" hidden>
        <iframe title="分表定位器" data-src="./sharding-table-finder.html?v=2"></iframe>
      </section>
      <section class="tool-panel" id="panel-photo" role="tabpanel" aria-labelledby="tab-photo" hidden>
        <iframe title="照片比例裁剪" data-src="./photo-crop.html?v=2"></iframe>
      </section>
      <section class="tool-panel" id="panel-sql" role="tabpanel" aria-labelledby="tab-sql" hidden>
        <iframe title="SQL 辅助工具" data-src="./sql-helper.html"></iframe>
      </section>
      <noscript><p>启用 JavaScript 即可使用标签页，也可以直接打开：<a href="./json-lens.html?v=2">JSON 工具</a><a href="./sharding-table-finder.html?v=2">分表定位</a><a href="./photo-crop.html?v=2">照片裁剪</a><a href="./sql-helper.html">SQL 辅助</a></p></noscript>
    </div>
    <footer><span>每一点微光，都让事情简单一点。</span><span class="footer-brand">微光 · Glimmer</span></footer>
  </main>
  <script>
    'use strict';
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const openLink = document.getElementById('open-tool');

    /**
     * 切换工具并同步无障碍状态；已打开的页面保留在内存中，避免切换丢失输入或照片。
     * @param {string} tool 工具标识；未知值回退到 JSON 工具。
     */
    function activateTool(tool) {
      const activeTab = tabs.find(tab => tab.dataset.tool === tool) || tabs[0];
      for (const tab of tabs) {
        const selected = tab === activeTab;
        const panel = document.getElementById(tab.getAttribute('aria-controls'));
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
        panel.hidden = !selected;
        if (selected) {
          const frame = panel.querySelector('iframe');
          // 首次选中才加载，且仅使用页面内预设路径，URL 片段不能指定外部地址。
          if (!frame.hasAttribute('src')) frame.src = frame.dataset.src;
          openLink.href = frame.dataset.src;
          openLink.setAttribute('aria-label', `在新窗口打开${tab.textContent.trim()}`);
        }
      }
      // 标签栏高度不足时自动滚动，让当前工具始终出现在可见区域。
      activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    /** 更新地址片段，让工具标签支持直接访问以及浏览器前进、后退。 */
    function selectTool(tab) {
      activateTool(tab.dataset.tool);
      if (location.hash !== `#${tab.dataset.tool}`) location.hash = tab.dataset.tool;
    }

    for (const tab of tabs) {
      tab.addEventListener('click', () => selectTool(tab));
      tab.addEventListener('keydown', event => {
        const index = tabs.indexOf(tab);
        let nextIndex;
        // 遵循纵向标签页键盘约定，Tab 键只停留在当前选中的工具。
        if (event.key === 'ArrowDown') nextIndex = (index + 1) % tabs.length;
        else if (event.key === 'ArrowUp') nextIndex = (index + tabs.length - 1) % tabs.length;
        else if (event.key === 'Home') nextIndex = 0;
        else if (event.key === 'End') nextIndex = tabs.length - 1;
        else return;
        event.preventDefault();
        tabs[nextIndex].focus();
        selectTool(tabs[nextIndex]);
      });
    }
    // 收起时保留图标、可访问名称和悬停提示，切换工具不重新加载工作区。
    const sidebarToggle = document.getElementById('sidebar-toggle');
    sidebarToggle.addEventListener('click', () => {
      const collapsed = document.body.classList.toggle('sidebar-collapsed');
      sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
      sidebarToggle.setAttribute('aria-label', collapsed ? '展开标签栏' : '收起标签栏');
      sidebarToggle.title = collapsed ? '展开标签栏' : '收起标签栏';
    });
    window.addEventListener('hashchange', () => activateTool(location.hash.slice(1)));
    activateTool(location.hash.slice(1));
  </script>
</body>
</html>
